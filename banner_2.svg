<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <!-- Soft radial background glow -->
    <radialGradient id="bgGlow" cx="78%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#1f1a0e"/>
      <stop offset="45%" stop-color="#100e09"/>
      <stop offset="100%" stop-color="#050403"/>
    </radialGradient>

    <!-- Horizontal metal gradient -->
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6de"/>
      <stop offset="22%" stop-color="#f0d78a"/>
      <stop offset="48%" stop-color="#c9a04a"/>
      <stop offset="72%" stop-color="#e8c874"/>
      <stop offset="100%" stop-color="#7a5c1e"/>
    </linearGradient>

    <!-- Vertical metal for pillar -->
    <linearGradient id="metalVert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="35%" stop-color="#e8c874"/>
      <stop offset="70%" stop-color="#b8923a"/>
      <stop offset="100%" stop-color="#6e5218"/>
    </linearGradient>

    <!-- Pan fill with depth -->
    <radialGradient id="panShade" cx="42%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#fff6de"/>
      <stop offset="40%" stop-color="#e0bc62"/>
      <stop offset="100%" stop-color="#7a5c1e"/>
    </radialGradient>

    <!-- Soft rim light for pans -->
    <linearGradient id="panRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e6b8"/>
      <stop offset="100%" stop-color="#8a6a24"/>
    </linearGradient>

    <!-- Subtle text glow -->
    <filter id="titleGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Emblem outer glow -->
    <filter id="emblemGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft drop shadow for badges -->
    <filter id="badgeShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <!-- Clip for scales -->
    <clipPath id="scaleClip">
      <rect x="-130" y="-130" width="260" height="260"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" fill="url(#bgGlow)"/>

  <!-- Very subtle top-edge vignette line -->
  <rect x="0" y="0" width="900" height="1" fill="#e8c874" opacity="0.08"/>
  <rect x="0" y="259" width="900" height="1" fill="#e8c874" opacity="0.06"/>

  <!-- Thin frame -->
  <rect x="4" y="4" width="892" height="252" fill="none" stroke="#e8c874" stroke-width="1.2" opacity="0.22"/>

  <!-- ========== LEFT TEXT BLOCK ========== -->
  <g transform="translate(48, 58)">
    <!-- Main title -->
    <text
      font-family="Georgia, 'Times New Roman', Times, serif"
      font-size="36"
      font-weight="700"
      fill="#e8c874"
      letter-spacing="2.5"
      filter="url(#titleGlow)"
    >V.SHIKAIKOVA</text>

    <!-- Subtitle -->
    <text
      y="32"
      font-family="Georgia, 'Times New Roman', Times, serif"
      font-size="15"
      font-style="italic"
      fill="#d4af5a"
      opacity="0.88"
    >Legal Engineer — building the future of law, quietly</text>
  </g>

  <!-- ========== PREMIUM INFO BADGES ========== -->
  <g transform="translate(48, 168)" filter="url(#badgeShadow)">
    <!-- Badge 1 -->
    <g>
      <rect x="0" y="0" width="292" height="28" rx="4" ry="4"
            fill="#12100a" stroke="#c9a04a" stroke-width="1" opacity="0.92"/>
      <rect x="0" y="0" width="4" height="28" rx="2" ry="2" fill="#e8c874"/>
      <text
        x="16" y="19"
        font-family="Georgia, 'Times New Roman', Times, serif"
        font-size="13"
        fill="#e8c874"
        letter-spacing="0.4"
      >Legal systems · Automation · Privacy by design</text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(0, 38)">
      <rect x="0" y="0" width="268" height="28" rx="4" ry="4"
            fill="#12100a" stroke="#c9a04a" stroke-width="1" opacity="0.92"/>
      <rect x="0" y="0" width="4" height="28" rx="2" ry="2" fill="#e8c874"/>
      <text
        x="16" y="19"
        font-family="Georgia, 'Times New Roman', Times, serif"
        font-size="13"
        fill="#e8c874"
        letter-spacing="0.4"
      >Contracts · Compliance · Digital architecture</text>
    </g>
  </g>

  <!-- ========== SCALES OF JUSTICE (right) ========== -->
  <g transform="translate(755, 128)" filter="url(#emblemGlow)" clip-path="url(#scaleClip)">

    <!-- Soft ambient glow behind emblem -->
    <circle r="108" cy="6" fill="#e8c874" opacity="0.07"/>

    <!-- ===== Pedestal / base ===== -->
    <ellipse cx="0" cy="108" rx="42" ry="8" fill="url(#panShade)" stroke="#6e5218" stroke-width="0.9"/>
    <!-- Base platform -->
    <path fill="url(#metal)" stroke="#6e5218" stroke-width="0.7"
          d="M-26,92 L26,92 L38,108 L-38,108 Z"/>
    <!-- Small top step -->
    <path fill="url(#metalVert)" stroke="#6e5218" stroke-width="0.5"
          d="M-18,86 L18,86 L22,92 L-22,92 Z"/>

    <!-- ===== Central pillar (solid) ===== -->
    <path stroke="url(#metalVert)" stroke-width="9" stroke-linecap="round"
          fill="none" d="M0,86 L0,-68"/>
    <!-- Pillar highlight edge -->
    <path stroke="#fff6de" stroke-width="1.4" stroke-linecap="round" opacity="0.45"
          d="M-2.2,84 L-2.2,-66"/>

    <!-- ===== Finial / ornamental top ===== -->
    <g transform="translate(0,-76)">
      <!-- Acanthus-like leaves -->
      <path fill="url(#metal)" stroke="#6e5218" stroke-width="0.6"
            d="M0,-18 C-5,-12 -6,-4 0,0 C6,-4 5,-12 0,-18 Z"/>
      <path fill="none" stroke="url(#metal)" stroke-width="1.8" stroke-linecap="round"
            d="M-15,6 C-10,-1 -5,-3 0,0"/>
      <path fill="none" stroke="url(#metal)" stroke-width="1.8" stroke-linecap="round"
            d="M15,6 C10,-1 5,-3 0,0"/>
      <!-- Central knob -->
      <circle r="5.2" fill="url(#metal)" stroke="#6e5218" stroke-width="0.7"/>
      <circle r="2.2" fill="#fff6de" opacity="0.55"/>
    </g>

    <!-- ===== Beam (massive, straight) ===== -->
    <g>
      <!-- Main beam body -->
      <rect x="-78" y="-66" width="156" height="8" rx="2.5" ry="2.5"
            fill="url(#metal)" stroke="#6e5218" stroke-width="0.8"/>
      <!-- Top highlight -->
      <rect x="-76" y="-65" width="152" height="2.2" rx="1" ry="1"
            fill="#fff6de" opacity="0.4"/>
      <!-- End caps -->
      <circle cx="-78" cy="-62" r="5" fill="url(#metal)" stroke="#6e5218" stroke-width="0.7"/>
      <circle cx="78" cy="-62" r="5" fill="url(#metal)" stroke="#6e5218" stroke-width="0.7"/>
      <!-- Center pivot -->
      <circle cx="0" cy="-62" r="5.5" fill="url(#metal)" stroke="#6e5218" stroke-width="0.8"/>
      <circle cx="0" cy="-62" r="2.4" fill="#fff6de" opacity="0.5"/>
    </g>

    <!-- ===== Left pan assembly ===== -->
    <g transform="translate(-78,-54)">
      <!-- Three neat chain links -->
      <path fill="none" stroke="#d4af5a" stroke-width="1.4" stroke-linecap="round"
            d="M-16,0 L-7,30"/>
      <path fill="none" stroke="#d4af5a" stroke-width="1.4" stroke-linecap="round"
            d="M0,2 L0,32"/>
      <path fill="none" stroke="#d4af5a" stroke-width="1.4" stroke-linecap="round"
            d="M16,0 L7,30"/>
      <!-- Small link rings -->
      <circle cx="-12" cy="12" r="2.3" fill="none" stroke="#e8c874" stroke-width="1.1"/>
      <circle cx="0" cy="15" r="2.3" fill="none" stroke="#e8c874" stroke-width="1.1"/>
      <circle cx="12" cy="12" r="2.3" fill="none" stroke="#e8c874" stroke-width="1.1"/>

      <!-- Volumetric elliptical pan -->
      <ellipse cx="0" cy="38" rx="26" ry="7.5" fill="url(#panShade)" stroke="#6e5218" stroke-width="1"/>
      <!-- Pan bowl depth -->
      <path fill="url(#panShade)" stroke="#6e5218" stroke-width="0.9"
            d="M-26,38 Q0,56 26,38 Q24,48 0,52 Q-24,48 -26,38 Z"/>
      <!-- Inner rim highlight -->
      <ellipse cx="0" cy="38" rx="22" ry="4.5" fill="none" stroke="#fff6de" stroke-width="0.9" opacity="0.35"/>
    </g>

    <!-- ===== Right pan assembly (mirrored) ===== -->
    <g transform="translate(78,-54)">
      <path fill="none" stroke="#d4af5a" stroke-width="1.4" stroke-linecap="round"
            d="M-16,0 L-7,30"/>
      <path fill="none" stroke="#d4af5a" stroke-width="1.4" stroke-linecap="round"
            d="M0,2 L0,32"/>
      <path fill="none" stroke="#d4af5a" stroke-width="1.4" stroke-linecap="round"
            d="M16,0 L7,30"/>
      <circle cx="-12" cy="12" r="2.3" fill="none" stroke="#e8c874" stroke-width="1.1"/>
      <circle cx="0" cy="15" r="2.3" fill="none" stroke="#e8c874" stroke-width="1.1"/>
      <circle cx="12" cy="12" r="2.3" fill="none" stroke="#e8c874" stroke-width="1.1"/>

      <ellipse cx="0" cy="38" rx="26" ry="7.5" fill="url(#panShade)" stroke="#6e5218" stroke-width="1"/>
      <path fill="url(#panShade)" stroke="#6e5218" stroke-width="0.9"
            d="M-26,38 Q0,56 26,38 Q24,48 0,52 Q-24,48 -26,38 Z"/>
      <ellipse cx="0" cy="38" rx="22" ry="4.5" fill="none" stroke="#fff6de" stroke-width="0.9" opacity="0.35"/>
    </g>

    <!-- Subtle sparkle accents (static, controlled) -->
    <circle cx="-98" cy="-38" r="1.6" fill="#fff6de" opacity="0.55"/>
    <circle cx="96" cy="18" r="1.3" fill="#fff6de" opacity="0.4"/>
    <circle cx="52" cy="-92" r="1.1" fill="#fff6de" opacity="0.45"/>
  </g>
</svg>
