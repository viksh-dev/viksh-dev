<svg xmlns="http://www.w3.org/2000/svg" width="900" height="90" viewBox="0 0 900 90">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#1a1508"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <style>
      .bg { fill: #050505; }
      .wave1 {
        fill: none;
        stroke: #e8c874;
        stroke-width: 1.2;
        opacity: 0.55;
      }
      .wave2 {
        fill: none;
        stroke: #e8c874;
        stroke-width: 1;
        opacity: 0.3;
      }
      .flow {
        offset-rotate: 0deg;
      }
    </style>
  </defs>
  <rect class="bg" width="900" height="90"/>
  <path id="w1" class="wave1" d="M0,45 C150,10 300,80 450,45 C600,10 750,80 900,45"/>
  <path id="w2" class="wave2" d="M0,60 C150,30 300,90 450,60 C600,30 750,90 900,60"/>
  <circle r="3" fill="#fff3d6">
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath href="#w1"/>
    </animateMotion>
  </circle>
  <circle r="2.5" fill="#e8c874" opacity="0.8">
    <animateMotion dur="8s" begin="1s" repeatCount="indefinite">
      <mpath href="#w2"/>
    </animateMotion>
  </circle>
</svg>